# SonarQube / SonarCloud configuration for Lumina.
#
# The point of the exclusions below: Sonar should analyse code YOU wrote and
# maintain. Generated files, vendored dependencies and machine-produced data
# inflate the line count, drag the metrics down, and produce issues nobody can
# action — which is how teams end up ignoring Sonar entirely.

sonar.projectKey=lumina
sonar.projectName=Lumina — AI Resume Intelligence
sonar.projectVersion=2.0

# ---------------------------------------------------------------------------
# What to analyse — the hand-written source, both stacks.
# ---------------------------------------------------------------------------
sonar.sources=src,backend/app,backend/ml,scripts,prisma
sonar.tests=src,backend/tests,e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,backend/tests/**/*.py

sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# What to skip, and why. Each of these is either generated, vendored, or data.
# ---------------------------------------------------------------------------
sonar.exclusions=\
  node_modules/**,\
  .next/**,\
  backend/.venv/**,\
  **/__pycache__/**,\
  src/generated/**,\
  backend/app/utils/skills_data.py,\
  src/lib/ai/skillsData.ts,\
  backend/ml/data/**,\
  backend/ml/models/**,\
  prisma/migrations/**,\
  public/**,\
  samples/**,\
  docs/**,\
  test-results/**,\
  playwright-report/**,\
  **/*.db,\
  **/*.db.backup-*

# Notes on the less obvious ones:
#   src/generated/**              Prisma client — regenerated by `prisma generate`.
#   skills_data.py / skillsData.ts GENERATED from shared/skills.json by
#                                 `npm run gen:shared`. Editing them is a bug,
#                                 so Sonar findings there are noise.
#   prisma/migrations/**          Machine-generated SQL; never hand-edited.
#   backend/ml/data|models        Training data and a binary model artifact.
#   samples/**                    Real resume documents — not code, and they
#                                 contain personal data that shouldn't be
#                                 uploaded to an analysis service.

# ---------------------------------------------------------------------------
# Coverage — only meaningful if you generate the reports first.
#   npm test -- --coverage
#   cd backend && pytest --cov=app --cov-report=xml
# ---------------------------------------------------------------------------
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.version=3.13

# Duplication: the four PDF template definitions in src/lib/resume/templates.ts
# are intentionally similar rows in a data table, not copy-paste logic.
sonar.cpd.exclusions=src/lib/resume/templates.ts,shared/**
